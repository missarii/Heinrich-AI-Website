
name: Deploy Heinrich AI to Surge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Surge
        run: npx --yes surge@latest . heinrich-ai.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
